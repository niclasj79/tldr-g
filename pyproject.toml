[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tp-vrg"
# This version tracks the CONTRACT SURFACE in this repo — the artifact formats,
# the verification behaviour, and the adapter interface. It deliberately does
# NOT track the engine binary's version (v0.1.x), because the two change for
# different reasons and consumers depend on this one. See CHANGELOG.md
# § Versioning for the rule.
version = "0.4.0"
description = "TLDR-G — open boundary contracts + offline verification for the knowledge rendering engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Engine-free public surface: attestation/verify needs cryptography; the
# provenance audit tool + the adapter contracts are stdlib-only.
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tp-vrg-verify = "tp_vrg.verify_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
